<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mili's Adventure</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('/fonts/PressStart2P.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'VT323';
      src: url('/fonts/VT323.ttf') format('truetype');
      font-display: swap;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0d0a14;
      color: #ffffff;
      font-family: 'Press Start 2P', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 94vw;
      max-width: calc(94vh * (16 / 9));
      aspect-ratio: 16 / 9;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9);
      border: 3px solid #4a3869;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      background-color: #121019;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    .hint {
      position: absolute;
      bottom: 10px;
      font-size: 9px;
      color: #8c7aa8;
      letter-spacing: 0.5px;
      font-family: 'Press Start 2P', monospace;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game"></canvas>
  </div>
  <div class="hint">[A/D / Flechas] Mover • [Espacio] Saltar • [Z/J] Atacar • [SHIFT/C] Bloquear • [F] Pantalla Completa</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
