<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinControl - Iniciar Sesión</title>
    <link rel="stylesheet" href="CSS/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    
    <!-- Luces difuminadas de fondo -->
    <div class="glow-blob glow-green-top"></div>
    <div class="glow-blob glow-green-bottom"></div>
    <div class="glow-blob glow-blue-top"></div>
    <div class="glow-blob glow-blue-bottom"></div>

    <div class="login-container">
        <div class="login-card">
            
            <div class="login-header">
                <div class="logo-box">
                    <i data-lucide="bar-chart-2"></i>
                </div>
                <h1>FinControl</h1>
                <p>Control Financiero & Gestión Inteligente</p>
            </div>

            <form action="inicio.html" class="login-form">
                
                <div class="input-group">
                    <label>Usuario o Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input type="email" placeholder="ejemplo@empresa.com" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" placeholder="••••••••••••" required>
                        <i data-lucide="eye" class="input-icon-right"></i>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Recordarme
                    </label>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-submit">
                    Ingresar al Dashboard <i data-lucide="arrow-right"></i>
                </button>
            </form>

            <div class="verification-section">
                <div class="divider">
                    <span>VERIFICACIÓN</span>
                </div>
                
                <div class="security-badge">
                    <i data-lucide="shield-check"></i>
                    Conexión cifrada de 256 bits
                </div>
                
                <p class="security-text">
                    Infraestructura auditada bajo estándar PCI-DSS & SOC2 Tipo II
                </p>
            </div>

            <div class="login-footer">
                <span>FinControl SAS © 2026</span>
                <div class="footer-links">
                    <a href="#">Privacidad</a>
                    <a href="#">Términos</a>
                    <a href="#">Soporte</a>
                </div>
            </div>

        </div>
    </div>

<script>
    lucide.createIcons();
</script>
</body>
</html>
